<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planificador Urbano</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <!-- TOOLBAR -->
    <div id="toolbar">
      <div class="toolbar-brand">🏙️ Planificador Urbano</div>
      <div class="toolbar-tools">
        <button id="tool-select" class="tool-btn active" title="Seleccionar (S)">
          <span class="tool-icon">↖</span><span class="tool-label">Seleccionar</span>
        </button>
        <button id="tool-delete" class="tool-btn" title="Eliminar seleccionado (Del)">
          <span class="tool-icon">🗑</span><span class="tool-label">Eliminar</span>
        </button>
        <div class="toolbar-separator"></div>
        <button id="btn-undo" class="tool-btn" title="Deshacer (Ctrl+Z)">
          <span class="tool-icon">↩</span><span class="tool-label">Deshacer</span>
        </button>
        <button id="btn-clear" class="tool-btn danger" title="Borrar todo">
          <span class="tool-icon">✕</span><span class="tool-label">Limpiar</span>
        </button>
        <div class="toolbar-separator"></div>
        <button id="btn-save" class="tool-btn" title="Guardar proyecto">
          <span class="tool-icon">💾</span><span class="tool-label">Guardar</span>
        </button>
        <button id="btn-load" class="tool-btn" title="Cargar proyecto">
          <span class="tool-icon">📂</span><span class="tool-label">Cargar</span>
        </button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main">

      <!-- SIDEBAR -->
      <div id="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-title">Construcciones</div>
          <div id="construction-list"></div>
        </div>

        <div class="sidebar-section" id="props-section" style="display:none">
          <div class="sidebar-title">Propiedades</div>
          <div id="props-panel">
            <div class="prop-row">
              <label>Nombre</label>
              <input type="text" id="prop-name" class="prop-input" />
            </div>
            <div class="prop-row" id="prop-color-row">
              <label>Color</label>
              <input type="color" id="prop-color" class="prop-color" />
            </div>
            <div id="props-extra"></div>
            <div class="prop-row">
              <label>Dimensiones</label>
              <span id="prop-dims" class="prop-value">–</span>
            </div>
            <button id="btn-delete-selected" class="btn-danger">🗑 Eliminar</button>
          </div>
        </div>

        <div class="sidebar-section" id="stats-section" style="display:none">
          <div class="sidebar-title">Estadísticas</div>
          <div id="stats-panel"></div>
        </div>
      </div>

      <!-- MAP -->
      <div id="map-wrapper">
        <div id="map"></div>
        <div id="status-bar">
          <span id="status-tool">Herramienta: Seleccionar</span>
          <span id="status-coords"></span>
          <span id="status-zoom"></span>
        </div>
      </div>

    </div>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
